name: CI-Pipeline
run-name: Testing after push
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This job was automatically triggered by ${{ github.actor }}."
      - uses: actions/checkout@v6
      - name: Set up JDK 11 for x64
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: x64

      - name: run tests
        run: mvn clean verify
      
